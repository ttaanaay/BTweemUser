name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Safety net: ensure the wrapper is executable even if the checked-out
      # file mode was lost (e.g. repo committed/edited from Windows).
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Without this, Gradle auto-generates a brand-new (random SHA-1) debug.keystore on
      # every single CI run, which silently breaks Google/Facebook/Microsoft sign-in every
      # time (their consoles are registered against one specific SHA-1). Restoring the same
      # keystore every run keeps that fingerprint permanently stable.
      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Print debug keystore SHA-1 (for verifying against Google/Facebook/Microsoft console configs)
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace --rerun-tasks

      - name: Print SHA-1 actually embedded in the built APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Checking: $APK_PATH"

          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            echo "--- via apksigner (reads v1/v2/v3 signing schemes correctly) ---"
            "$APKSIGNER" verify --print-certs "$APK_PATH" || true
          fi

          echo "--- via keytool (legacy v1/JAR signature only, shown for comparison) ---"
          keytool -printcert -jarfile "$APK_PATH" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TheQuote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
